<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .star { fill: rgba(232,168,58,0.15); stroke: #E8A83A; stroke-width: 3; }
    .ring { fill: none; stroke: #E8A83A; stroke-width: 2.5; }
    @media (prefers-color-scheme: light) {
      .star { fill: rgba(192,120,40,0.18); stroke: #C07828; stroke-width: 3; }
      .ring { fill: none; stroke: #C07828; stroke-width: 2.5; }
    }
  </style>
  <polygon class="star"
    points="50,4 59,41 96,50 59,59 50,96 41,59 4,50 41,41"/>
  <circle class="ring" cx="50" cy="50" r="30"/>
</svg>