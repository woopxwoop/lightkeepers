services:
  postgres:
    image: postgres:15.8
    container_name: staging-postgres
    restart: unless-stopped
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:5433:5432"
      - "10.0.0.3:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightkeepers -d lightkeepers"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgrest:
    image: postgrest/postgrest:v14.6
    container_name: staging-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@postgres:5432/lightkeepers
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: staging-postgrest-gateway
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgrest

volumes:
  pgdata:
