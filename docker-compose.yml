# Production stack (VPS).
# Private app secrets + TUNNEL_TOKEN are written to ~/app/.env by deploy.yml
# (from GitHub Actions secrets). They are NOT baked into the image.
# Public Supabase anon URL/key are still build-args (browser-visible by design).

services:
  app:
    image: ghcr.io/woopxwoop/lightkeepers:latest
    env_file:
      - .env
    environment:
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379}
    restart: unless-stopped
    # Optional host bind for curl/debug. Bound to loopback so the public
    # internet cannot bypass Cloudflare Tunnel (rate limits, /metrics, etc.).
    # Drop this publish entirely if you don't need direct access.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - internal

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    # No host ports — app reaches it only on the compose network.
    volumes:
      - valkey-data:/data
    command:
      - valkey-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./secrets/remote_write_password:/etc/prometheus/secrets/remote_write_password:ro
      - ./secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - internal

volumes:
  prometheus_data:
  valkey-data:

networks:
  internal:
