global:
  scrape_interval: 60s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lightkeepers
    static_configs:
      # Docker Compose service name for the app container.
      - targets: ["app:3000"]
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token

  - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
    basic_auth:
      username: 3104352
      password_file: /etc/prometheus/secrets/remote_write_password
