name: Sync Characters

# Polls daily. Only runs the full sync when the API reports a version
# newer than what's in the DB, i.e. a new patch has dropped.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check for new version
        id: version_check
        run: pnpm exec tsx scripts/check-version.ts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}

      - name: Sync character metadata from Enka (element, weapon_type, name_id, character_id)
        if: steps.version_check.outputs.is_new == 'true'
        run: pnpm exec tsx scripts/enka.ts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}

      - name: Sync enemy info from Lunaris
        if: steps.version_check.outputs.is_new == 'true'
        run: pnpm exec tsx scripts/lunaris.ts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}

      - name: Sync character and enemy images to R2
        if: steps.version_check.outputs.is_new == 'true'
        run: pnpm exec tsx scripts/sync-character-images-r2.ts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
