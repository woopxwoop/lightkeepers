name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

# migrate-prod is one directory on the app server. A second run must wait
# instead of deleting it while the first is still applying migrations.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  reconcile-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clear previous database copy
        uses: appleboy/ssh-action@v1
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf "$HOME/db-job"

      - name: Copy database stack
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "db"
          target: db-job/

      - name: Reconcile database stacks
        uses: appleboy/ssh-action@v1
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            bash "$HOME/db-job/db/bootstrap.sh"

  build-and-deploy:
    needs: reconcile-database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Migrate before the image is published. A failed migration must not
      # move :latest. DATABASE_URL is the database the running app uses.
      - name: Clear previous migrator copy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf "$HOME/migrate-prod"

      - name: Copy migrator to app server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "migrations"
          target: migrate-prod/

      - name: Apply database migrations
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          envs: DATABASE_URL
          script: |
            set -euo pipefail
            bash "$HOME/migrate-prod/migrations/migrate-remote.sh"

      # Prometheus refuses to start on a malformed config, and the compose
      # restart loop is silent — catch it here instead of on the VPS.
      - name: Validate Prometheus config
        run: |
          # promtool stats the credentials files, so stub the real secrets.
          mkdir -p /tmp/prometheus-secrets
          printf 'stub' > /tmp/prometheus-secrets/metrics_token
          printf 'stub' > /tmp/prometheus-secrets/remote_write_password
          docker run --rm \
            -v "$PWD/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v /tmp/prometheus-secrets:/etc/prometheus/secrets:ro \
            --entrypoint promtool \
            prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/woopxwoop/lightkeepers:latest
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_KEY=${{ secrets.PUBLIC_SUPABASE_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Create runtime env file
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          PROMETHEUS_REMOTE_WRITE_PASSWORD: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          keys = [
              "TUNNEL_TOKEN",
              "PRIVATE_SUPABASE_KEY",
              "DATABASE_URL",
              "BETTER_AUTH_SECRET",
              "BETTER_AUTH_URL",
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
              "DISCORD_CLIENT_ID",
              "DISCORD_CLIENT_SECRET",
              "VALKEY_URL",
              "METRICS_TOKEN",
          ]
          with open("vps.env", "w", encoding="utf-8") as f:
              for key in keys:
                  value = os.environ.get(key) or ""
                  if not value:
                      continue
                  # Single-quoted Compose env values preserve `$` literally.
                  # Embed a single quote as: end quote, \', reopen quote.
                  escaped = value.replace("'", "'\\''")
                  f.write(f"{key}='{escaped}'\n")
          PY
          printf '%s' "$PROMETHEUS_REMOTE_WRITE_PASSWORD" > remote_write_password
          printf '%s' "$METRICS_TOKEN" > metrics_token

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,prometheus.yml,vps.env,remote_write_password,metrics_token"
          target: app/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            mkdir -p ~/app/data/immutable
            mv ~/app/vps.env ~/app/.env
            chmod 600 ~/app/.env
            mkdir -p ~/app/secrets
            mv ~/app/remote_write_password ~/app/secrets/remote_write_password
            mv ~/app/metrics_token ~/app/secrets/metrics_token
            chmod 644 ~/app/secrets/remote_write_password ~/app/secrets/metrics_token
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/lightkeepers:latest
            docker compose -f ~/app/docker-compose.yml --project-directory ~/app up -d
            healthy=""
            code=""
            for _ in $(seq 1 45); do
              code=$(curl -s -o /tmp/lightkeepers-health.json -w "%{http_code}" --max-time 5 http://127.0.0.1:3000/api/health || true)
              if [ "$code" = "200" ]; then
                healthy=1
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "api health check failed with status ${code:-none}" >&2
              cat /tmp/lightkeepers-health.json >&2 || true
              docker compose -f ~/app/docker-compose.yml --project-directory ~/app logs --tail 80 app >&2 || true
              exit 1
            fi
            echo "api health ok"
            docker image prune -af

  # The database server runs the nightly dump. Each deploy copies the script
  # and reconciles crontab; an unchanged script leaves the existing line.
  install-backup-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clear previous backup script
        uses: appleboy/ssh-action@v1
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: rm -rf "$HOME/backup-job"

      - name: Copy backup script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backups/backup.sh,backups/restore-check.sh"
          target: backup-job/

      - name: Reconcile backup cron
        uses: appleboy/ssh-action@v1
        with:
          host: "167.233.174.167"
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            bash "$HOME/backup-job/backups/backup.sh" install
            bash "$HOME/backup-job/backups/restore-check.sh" install
