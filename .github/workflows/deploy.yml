name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/woopxwoop/lightkeepers:latest
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          build-args: |
            PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_KEY=${{ secrets.PUBLIC_SUPABASE_KEY }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Create runtime env file
        env:
          TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          PROMETHEUS_REMOTE_WRITE_PASSWORD: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 <<'PY'
          import os
          keys = [
              "TUNNEL_TOKEN",
              "PRIVATE_SUPABASE_KEY",
              "DATABASE_URL",
              "BETTER_AUTH_SECRET",
              "BETTER_AUTH_URL",
              "GOOGLE_CLIENT_ID",
              "GOOGLE_CLIENT_SECRET",
              "DISCORD_CLIENT_ID",
              "DISCORD_CLIENT_SECRET",
              "VALKEY_URL",
              "METRICS_TOKEN",
          ]
          with open("vps.env", "w", encoding="utf-8") as f:
              for key in keys:
                  value = os.environ.get(key) or ""
                  if not value:
                      continue
                  # Single-quoted Compose env values preserve `$` literally.
                  # Embed a single quote as: end quote, \', reopen quote.
                  escaped = value.replace("'", "'\\''")
                  f.write(f"{key}='{escaped}'\n")
          PY
          printf '%s' "$PROMETHEUS_REMOTE_WRITE_PASSWORD" > remote_write_password
          printf '%s' "$METRICS_TOKEN" > metrics_token

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml,prometheus.yml,vps.env,remote_write_password,metrics_token"
          target: app/

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            mkdir -p ~/app/data/immutable
            mv ~/app/vps.env ~/app/.env
            chmod 600 ~/app/.env
            mkdir -p ~/app/secrets
            mv ~/app/remote_write_password ~/app/secrets/remote_write_password
            chmod 600 ~/app/secrets/remote_write_password
            mv ~/app/metrics_token ~/app/secrets/metrics_token
            chmod 600 ~/app/secrets/metrics_token
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/lightkeepers:latest
            docker compose -f ~/app/docker-compose.yml --project-directory ~/app up -d
