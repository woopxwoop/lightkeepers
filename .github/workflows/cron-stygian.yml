name: Stygian Cron

on:
  # Matches the original Vercel schedule: 0 15 */4 * *
  schedule:
    - cron: "0 15 */4 * *"
  workflow_dispatch:

jobs:
  update-stygian:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run stygian update
        run: pnpm exec tsx scripts/cron-stygian.ts
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PRIVATE_SUPABASE_KEY: ${{ secrets.PRIVATE_SUPABASE_KEY }}
